# On a tag v* (for example v0.5.0): the same build and tests as ci.yml, then a GitHub Release with
# V3X-Setup.exe, v3x-<version>.zip, install.ps1, compat.json (read by the in-game updater:
# releases/latest/download/compat.json) and SHA256SUMS.txt.
# "irm https://github.com/kleeedolinux/v3x/releases/latest/download/install.ps1 | iex" and install.ps1's
# own download use the latest release, so a tag with a '-' (v0.6.0-rc1) is published as a prerelease
# and does not become "latest".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      ZIGLANG_VERSION: "0.17.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install zig (ziglang from PyPI)
        run: |
          python -m pip install --disable-pip-version-check "ziglang==${ZIGLANG_VERSION}"
          python -m ziglang version

      - name: Version from the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          [[ "$ver" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::tag $tag is not a version"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [[ "$ver" == *-* ]]; then echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"; else echo "prerelease=" >> "$GITHUB_OUTPUT"; fi

      - name: Build
        run: bash build.sh

      - name: Offline tests (test/run_all.sh)
        run: bash .github/scripts/ci_tests.sh

      - name: Installer (make_dist.py)
        run: python installer/make_dist.py --no-build --version "${{ steps.ver.outputs.version }}"

      - name: Installer test (V3X-Setup.exe)
        run: python installer/test_installer.py --root "$RUNNER_TEMP/inst"

      - name: Installer test (install.ps1, PowerShell 5.1 + 7)
        run: python installer/test_install_ps1.py --root "$RUNNER_TEMP/install_ps1" --shell powershell,pwsh

      - name: Check release files
        working-directory: build/dist
        run: |
          ls -l V3X-Setup.exe "v3x-${{ steps.ver.outputs.version }}.zip" install.ps1 compat.json SHA256SUMS.txt
          python -c "import json; d=json.load(open('compat.json', encoding='utf-8')); print(d); assert d['schema'] == 1 and d['v3x_version'] == '${{ steps.ver.outputs.version }}' and d['game_builds']"
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          VER: ${{ steps.ver.outputs.version }}
          PRE: ${{ steps.ver.outputs.prerelease }}
        working-directory: build/dist
        run: |
          files=(V3X-Setup.exe "v3x-${VER}.zip" install.ps1 compat.json SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            notes="Install (Windows, no admin): close Victoria 3, open PowerShell and run
          \`irm https://v3extender.pages.dev/install.ps1 | iex\`
          or download and run V3X-Setup.exe. Player guide: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/install.md
          Check the files with SHA256SUMS.txt. Single player only."
            gh release create "$TAG" "${files[@]}" --verify-tag --title "V3X ${VER}" --notes "$notes" --generate-notes $PRE
          fi
