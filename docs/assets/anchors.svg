<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">How a V3X plugin finds engine code</title><desc id="d">A string or RTTI anchor, its cross-reference in code, the enclosing function from the unwind table with a prologue check, then a safe hook. Any mismatch fails closed.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="462" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="462" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="442" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">How a plugin finds engine code</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">Addresses move with every game patch. Strings, RTTI names and code shapes rarely do.</text><rect x="40" y="98" width="252" height="206" rx="8" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="56" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">1 · Anchor</text><rect x="52" y="142" width="228" height="34" rx="4" fill="#14202e"/><text x="166" y="165" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2c07a" text-anchor="middle">&quot;Processing Tick: &quot;</text><text x="56" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">a string in .rdata</text><text x="56" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">(or an RTTI class name)</text><text x="56" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">that the engine uses</text><text x="56" y="288" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2f6f73" text-anchor="start">find_string()</text><line x1="294" y1="200" x2="324" y2="200" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="328" y="98" width="252" height="206" rx="8" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="344" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">2 · Cross-reference</text><rect x="340" y="142" width="228" height="34" rx="4" fill="#14202e"/><text x="454" y="165" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2c07a" text-anchor="middle">lea reg, [rip+disp32]</text><text x="344" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">the instruction in .text</text><text x="344" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">that loads that string</text><text x="344" y="288" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2f6f73" text-anchor="start">find_xref()</text><line x1="582" y1="200" x2="612" y2="200" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="616" y="98" width="252" height="206" rx="8" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="632" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">3 · Function start</text><rect x="628" y="142" width="228" height="34" rx="4" fill="#14202e"/><text x="742" y="165" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2c07a" text-anchor="middle">48 89 5C 24 ?? ...</text><text x="632" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">enclosing function from</text><text x="632" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">the .pdata unwind table;</text><text x="632" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">prologue bytes checked</text><text x="632" y="288" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2f6f73" text-anchor="start">function_start()</text><line x1="870" y1="200" x2="900" y2="200" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="904" y="98" width="252" height="206" rx="8" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="920" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#e2c07a" text-anchor="start">4 · Safe hook</text><rect x="916" y="142" width="228" height="34" rx="4" fill="#14202e"/><text x="1030" y="165" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#e2c07a" text-anchor="middle">pre(call) → original → post(call)</text><text x="920" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">thunk forwards 16 integer</text><text x="920" y="224" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">slots + xmm0-3 and keeps</text><text x="920" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">the return value</text><text x="920" y="288" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e2c07a" text-anchor="start">hook_safe()</text><line x1="166.0" y1="306" x2="166.0" y2="352" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)"/><line x1="454.0" y1="306" x2="454.0" y2="352" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)"/><line x1="742.0" y1="306" x2="742.0" y2="352" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrR)"/><rect x="40" y="356" width="828" height="78" rx="8" fill="#f8e6df" stroke="#9b2d20" stroke-width="2"/><text x="60" y="384" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#9b2d20" text-anchor="start">Not found, not unique, or the bytes differ?</text><text x="60" y="410" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">Fail closed: install nothing, log  anchor ... FAILED  in v3x.log; that plugin or feature stays vanilla.</text><rect x="904" y="356" width="256" height="78" rx="8" fill="#e7efe9" stroke="#2f6f73" stroke-width="2"/><text x="920" y="384" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#2f6f73" text-anchor="start">All checks pass?</text><text x="920" y="410" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">Hook it. The callbacks see</text><text x="920" y="428" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">every argument + return value.</text>
</svg>
