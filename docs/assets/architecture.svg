<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 779" width="1200" height="779" role="img" aria-labelledby="t d">
<title id="t">V3X architecture</title><desc id="d">victoria3.exe loads binaries/version.dll (the V3X proxy, loader 0.6.0), which forwards to System32 version.dll and boots the V3X core. The core offers loader, code finding, hooks, frame tick, console and events (API v6) to the plugins, which hook engine functions after fail-closed anchor checks.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><marker id="ah1f3550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker></defs>
<rect x="4" y="4" width="1192" height="771" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="771" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="751" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">How V3X loads</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">No game file is changed: Windows loads V3X because the game asks for version.dll</tspan></text><rect x="40" y="105" width="301.1" height="96" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="301.1" height="96" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b1" text-anchor="middle" font-size="17"><tspan x="190.6" y="136.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f3550" font-weight="bold">victoria3.exe</tspan></text><text data-box="b1" text-anchor="middle" font-size="13"><tspan x="190.6" y="161.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">the unmodified game</tspan><tspan x="190.6" y="178.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">imports VERSION.dll</tspan></text><rect x="449.4" y="105" width="301.1" height="96" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b2" x="449.4" y="102" width="301.1" height="96" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text data-box="b2" text-anchor="middle" font-size="17"><tspan x="600" y="136.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#e2c07a" font-weight="bold">binaries/version.dll</tspan></text><text data-box="b2" text-anchor="middle" font-size="13"><tspan x="600" y="161.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">the V3X proxy, found first</tspan><tspan x="600" y="178.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">(version.dll is not a KnownDLL)</tspan></text><rect x="858.9" y="105" width="301.1" height="96" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b3" x="858.9" y="102" width="301.1" height="96" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b3" text-anchor="middle" font-size="17"><tspan x="1009.4" y="136.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#1f3550" font-weight="bold">System32\version.dll</tspan></text><text data-box="b3" text-anchor="middle" font-size="13"><tspan x="1009.4" y="161.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">the real Windows DLL</tspan><tspan x="1009.4" y="178.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">gets all 17 exports forwarded</tspan></text><path data-arrow="1" d="M345.1,150 L445.4,150" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="middle" font-size="12"><tspan x="395.3" y="142.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">loads</tspan></text><path data-arrow="1" d="M754.6,150 L854.9,150" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="middle" font-size="12"><tspan x="804.7" y="142.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">forwards</tspan></text><rect x="40" y="247" width="1120" height="249" rx="12" fill="#14202e" opacity=".14"/><rect data-id="b4" x="40" y="244" width="1120" height="249" rx="12" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><path data-arrow="1" d="M600,202 L600,240" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="612" y="225.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">DllMain hooks only the exe entry point (nothing else under the loader lock); the core starts there</tspan></text><text data-box="b4" text-anchor="start" font-size="21"><tspan x="58" y="280.9" font-family="Georgia, 'Times New Roman', Times, serif" font-size="21" fill="#1f3550" font-weight="bold">V3X core</tspan></text><text data-box="b4" text-anchor="start" font-size="13"><tspan x="178.5" y="277.6" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">src/core.c</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e"> +</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e"> src/safe_hook.c</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e"> · the plugin API:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e"> include/v3x.h</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">, API v6, plain C, versioned and append-only · loader 0.6.0</tspan></text><rect data-id="b5" data-parent="b4" x="58" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="58" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b5" text-anchor="start" font-size="15"><tspan x="70" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Loader</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">plugins/*.dll</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">trusted plugin list</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="396.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">[plugins] skip list</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="416.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">manifests, min_api</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="436.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">caps (v6)</tspan></text><text data-box="b5" text-anchor="start" font-size="12.5"><tspan x="70" y="456.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">game_build_id</tspan></text><rect data-id="b6" data-parent="b4" x="240.7" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="240.7" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b6" text-anchor="start" font-size="15"><tspan x="252.7" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Find code</tspan></text><text data-box="b6" text-anchor="start" font-size="12.5"><tspan x="252.7" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">find_string</tspan></text><text data-box="b6" text-anchor="start" font-size="12.5"><tspan x="252.7" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">find_xref</tspan></text><text data-box="b6" text-anchor="start" font-size="12.5"><tspan x="252.7" y="396.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">function_start</tspan></text><text data-box="b6" text-anchor="start" font-size="12.5"><tspan x="252.7" y="416.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">pattern_scan</tspan></text><rect data-id="b7" data-parent="b4" x="423.3" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="423.3" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b7" text-anchor="start" font-size="15"><tspan x="435.3" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Hooks</tspan></text><text data-box="b7" text-anchor="start" font-size="12.5"><tspan x="435.3" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">hook_safe (v4)</tspan></text><text data-box="b7" text-anchor="start" font-size="12.5"><tspan x="435.3" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">hook / unhook</tspan></text><text data-box="b7" text-anchor="start" font-size="12.5"><tspan x="435.3" y="396.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">patch</tspan></text><rect data-id="b8" data-parent="b4" x="606" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="606" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b8" text-anchor="start" font-size="15"><tspan x="618" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Frame tick</tspan></text><text data-box="b8" text-anchor="start" font-size="12.5"><tspan x="618" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">on_frame</tspan></text><text data-box="b8" text-anchor="start" font-size="12.5"><tspan x="618" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">run_on_main</tspan></text><text data-box="b8" text-anchor="start" font-size="12"><tspan x="618" y="396" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#14202e" font-style="italic">(PeekMessageW hook,</tspan><tspan x="618" y="411.8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#14202e" font-style="italic">main thread)</tspan></text><rect data-id="b9" data-parent="b4" x="788.7" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="788.7" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b9" text-anchor="start" font-size="15"><tspan x="800.7" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Console</tspan></text><text data-box="b9" text-anchor="start" font-size="12.5"><tspan x="800.7" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">register_command</tspan></text><text data-box="b9" text-anchor="start" font-size="12.5"><tspan x="800.7" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">print</tspan></text><text data-box="b9" text-anchor="start" font-size="12.5"><tspan x="800.7" y="396.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">exec_command</tspan></text><text data-box="b9" text-anchor="start" font-size="12.5"><tspan x="800.7" y="416.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">exec_capture</tspan></text><text data-box="b9" text-anchor="start" font-size="12.5"><tspan x="800.7" y="436.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">enum_commands</tspan></text><rect data-id="b10" data-parent="b4" x="971.3" y="300.5" width="170.7" height="174.4" rx="8" fill="#f4ecd8" stroke="#2c4a6e" stroke-width="1.2"/><rect x="971.3" y="300.5" width="170.7" height="4" rx="2" fill="#b98b3e"/><text data-box="b10" text-anchor="start" font-size="15"><tspan x="983.3" y="328.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Events</tspan></text><text data-box="b10" text-anchor="start" font-size="12.5"><tspan x="983.3" y="356.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">on_event</tspan></text><text data-box="b10" text-anchor="start" font-size="12.5"><tspan x="983.3" y="376.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">emit_event</tspan></text><text data-box="b10" text-anchor="start" font-size="12.5"><tspan x="983.3" y="396.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">load_transition</tspan></text><text data-box="b10" text-anchor="start" font-size="12.5"><tspan x="983.3" y="416.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">save_begin /</tspan><tspan x="983.3" y="433" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">save_end</tspan></text><text data-box="b10" text-anchor="start" font-size="12.5"><tspan x="983.3" y="453" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550">process_exit</tspan></text><rect x="40" y="541.9" width="1120" height="89" rx="12" fill="#14202e" opacity=".14"/><rect data-id="b11" x="40" y="538.9" width="1120" height="89" rx="12" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><path data-arrow="1" d="M600,496.9 L600,534.9" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="612" y="520.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#7a5a22" font-style="italic">v3x_plugin_load(&amp;api)</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic"> for every enabled plugin, before the game's CRT starts</tspan></text><text data-box="b11" text-anchor="start" font-size="19"><tspan x="58" y="573.6" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#1f3550" font-weight="bold">Plugins</tspan></text><rect data-id="b12" data-parent="b11" x="154.2" y="552.9" width="119.2" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b12" text-anchor="middle" font-size="13"><tspan x="213.8" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">crash_logger</tspan></text><rect data-id="b13" data-parent="b11" x="281.4" y="552.9" width="95.4" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b13" text-anchor="middle" font-size="13"><tspan x="329.1" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">mem_tuner</tspan></text><rect data-id="b14" data-parent="b11" x="384.8" y="552.9" width="95.4" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b14" text-anchor="middle" font-size="13"><tspan x="432.5" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">lazy_mesh</tspan></text><rect data-id="b15" data-parent="b11" x="488.1" y="552.9" width="119.2" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b15" text-anchor="middle" font-size="13"><tspan x="547.7" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">keep_history</tspan></text><rect data-id="b16" data-parent="b11" x="615.3" y="552.9" width="79.5" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b16" text-anchor="middle" font-size="13"><tspan x="655.1" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">enhance</tspan></text><rect data-id="b17" data-parent="b11" x="702.8" y="552.9" width="103.3" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b17" text-anchor="middle" font-size="13"><tspan x="754.5" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">mod_loader</tspan></text><rect data-id="b18" data-parent="b11" x="814.1" y="552.9" width="95.4" height="30" rx="15" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b18" text-anchor="middle" font-size="13"><tspan x="861.8" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f3550" font-weight="bold">+ 27 more</tspan></text><rect data-id="b19" data-parent="b11" x="917.5" y="552.9" width="142.9" height="30" rx="15" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.3" stroke-dasharray="4 3"/><text data-box="b19" text-anchor="middle" font-size="13"><tspan x="989" y="573.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#2f6f73" font-weight="bold">your_plugin.dll</tspan></text><text data-box="b11" text-anchor="start" font-size="12.5"><tspan x="154.2" y="606.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">33 bundled plugins and community plugins live in</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> binaries/v3x/plugins/</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">; each one can be switched off in</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> binaries/v3x/v3x.ini</tspan></text><rect x="160" y="676.9" width="880" height="74.2" rx="12" fill="#14202e" opacity=".14"/><rect data-id="b20" x="160" y="673.9" width="880" height="74.2" rx="12" fill="#14202e" stroke="#7a5a22" stroke-width="2"/><path data-arrow="1" d="M600,631.9 L600,669.9" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="612" y="655.8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">hook / patch</tspan></text><text data-box="b20" text-anchor="middle" font-size="18"><tspan x="600" y="707.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#e2c07a" font-weight="bold">engine functions inside victoria3.exe</tspan></text><text data-box="b20" text-anchor="middle" font-size="13"><tspan x="600" y="730.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">hooked or patched only after a fail-closed anchor check; no match = that feature installs nothing</tspan></text>
</svg>
