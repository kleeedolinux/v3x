<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
<title id="t">V3X architecture</title><desc id="d">victoria3.exe loads binaries/version.dll (the V3X proxy), which forwards to System32 version.dll and boots the V3X core. The core offers loader, code finding, hooks, frame tick, console and events to plugins, which hook engine functions after fail-closed anchor checks.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="712" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="712" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="692" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">How V3X loads</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">No game file is changed: Windows loads V3X because the game asks for version.dll</text><rect x="40" y="100" width="300" height="92" rx="8" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="190" y="132" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="bold" fill="#1f3550" text-anchor="middle">victoria3.exe</text><text x="190" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="middle">the unmodified game</text><text x="190" y="173.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="middle">imports VERSION.dll</text><rect x="440" y="100" width="320" height="92" rx="8" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="600" y="132" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="bold" fill="#e2c07a" text-anchor="middle">binaries/version.dll</text><text x="600" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="middle">the V3X proxy, found first</text><text x="600" y="173.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="middle">(version.dll is not a KnownDLL)</text><rect x="860" y="100" width="300" height="92" rx="8" fill="#fffaf0" stroke="#1f3550" stroke-width="2" stroke-dasharray="6 4"/><text x="1010" y="132" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="bold" fill="#1f3550" text-anchor="middle">System32\version.dll</text><text x="1010" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="middle">the real Windows DLL</text><text x="1010" y="173.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="middle">gets all 17 exports forwarded</text><line x1="340" y1="146" x2="436" y2="146" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><text x="388" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="middle">loads</text><line x1="760" y1="146" x2="856" y2="146" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><text x="808" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="middle">forwards</text><line x1="600" y1="192" x2="600" y2="238" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><text x="612" y="222" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">DllMain hooks only the exe entry point (nothing else under the loader lock)</text><rect x="40" y="242" width="1120" height="220" rx="12" fill="#fbf4e4" stroke="#1f3550" stroke-width="3"/><text x="64" y="274" font-family="Georgia, 'Times New Roman', Times, serif" font-size="21" font-weight="bold" fill="#1f3550" text-anchor="start">V3X core</text><text x="170" y="274" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">src/core.c + src/safe_hook.c  ·  the plugin API: include/v3x.h, API v4, plain C, versioned and append-only</text><rect x="60.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="60" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="145" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Loader</text><text x="145" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">plugins/*.dll</text><text x="145" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">[plugins] skip list</text><text x="145" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">manifests, min_api</text><text x="145" y="409" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">game_build_id</text><rect x="242.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="242" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="327" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Find code</text><text x="327" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">find_string</text><text x="327" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">find_xref</text><text x="327" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">function_start</text><text x="327" y="409" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">pattern_scan</text><rect x="424.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="424" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="509" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Hooks</text><text x="509" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">hook_safe (v4)</text><text x="509" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">hook / unhook</text><text x="509" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">patch</text><rect x="606.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="606" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="691" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Frame tick</text><text x="691" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">on_frame</text><text x="691" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">run_on_main</text><text x="691" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">(PeekMessageW hook,</text><text x="691" y="409" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">main thread)</text><rect x="788.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="788" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="873" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Console</text><text x="873" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">register_command</text><text x="873" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">print, exec_command</text><text x="873" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">exec_capture</text><text x="873" y="409" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">enum_commands</text><rect x="970.0" y="292" width="170.0" height="150" rx="6" fill="#fffaf0" stroke="#7a5a22" stroke-width="1.5"/><rect x="970" y="292" width="170" height="30" rx="6" fill="url(#brass)"/><text x="1055" y="313" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">Events</text><text x="1055" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">on_event</text><text x="1055" y="367" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">emit_event</text><text x="1055" y="388" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#1f3550" text-anchor="middle">process_exit</text><line x1="600" y1="462" x2="600" y2="500" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><text x="612" y="490" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">v3x_plugin_load(&amp;api) for every enabled plugin, before the game's CRT starts</text><rect x="40" y="506" width="126.39999999999999" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="103.2" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">crash_logger</text><rect x="176.39999999999998" y="506" width="98.8" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="225.8" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">mem_tuner</text><rect x="285.2" y="506" width="98.8" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="334.6" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">fast_load</text><rect x="394.0" y="506" width="98.8" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="443.4" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">lazy_mesh</text><rect x="502.8" y="506" width="126.39999999999999" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="566" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">keep_history</text><rect x="639.2" y="506" width="80.39999999999999" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="679.4" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">enhance</text><rect x="729.6" y="506" width="117.19999999999999" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="788.2" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">frame_pacer</text><rect x="856.8" y="506" width="98.8" height="36" rx="18" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="906.2" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#1f3550" text-anchor="middle">+ 18 more</text><rect x="971.5999999999999" y="506" width="188.4000000000001" height="36" rx="18" fill="#fffaf0" stroke="#2f6f73" stroke-width="2" stroke-dasharray="6 4"/><text x="1065.8" y="529" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#2f6f73" text-anchor="middle">your_plugin.dll</text><text x="40" y="566" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">25 bundled plugins (binaries/v3x/plugins/), each one can be switched off in binaries/v3x/v3x.ini</text><line x1="130" y1="574" x2="130" y2="616" stroke="#1f3550" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><line x1="330" y1="574" x2="330" y2="616" stroke="#1f3550" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><line x1="530" y1="574" x2="530" y2="616" stroke="#1f3550" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><line x1="730" y1="574" x2="730" y2="616" stroke="#1f3550" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><line x1="930" y1="574" x2="930" y2="616" stroke="#1f3550" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><rect x="40" y="620" width="1120" height="64" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="600" y="648" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#e2c07a" text-anchor="middle">engine functions inside victoria3.exe</text><text x="600" y="670" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="middle">hooked or patched only after a fail-closed anchor check; no match = that feature installs nothing</text>
</svg>
