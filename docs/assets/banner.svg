<title id="t">V3X: the engine-level modding platform for Victoria 3</title><desc id="d">Banner: V3X emblem and title, the engine-level modding platform. Build mods that run inside Victoria 3's engine: hook functions safely, read live data, add commands. Loader 0.6.0, API v6, SDK, 33 plugins. Game 1.15.1, Windows x64, single player, unofficial.</desc>
