<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">A normal Victoria 3 mod compared with V3X</title><desc id="d">A normal mod is text and data the game runs inside its own rules and can change content, not the engine. V3X is a small native add-on (version.dll) that runs inside the game's program and can fix and speed up the engine. They work together.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="512" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="512" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="492" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">A normal mod and V3X do different jobs</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">They work together: V3X does not replace mods, and your playset stays the same.</text><rect x="40" y="92" width="540" height="400" rx="12" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="310" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" font-weight="bold" fill="#1f3550" text-anchor="middle">A normal mod</text><line x1="70" y1="142" x2="550" y2="142" stroke="#b98b3e" stroke-width="1.5"/><text x="70" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start">What it is</text><text x="210" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">text and data files: events, buildings,</text><text x="210" y="193" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">laws, GUI, scripts, maps, art</text><text x="70" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start">Where it runs</text><text x="210" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">the game reads it and runs it</text><text x="210" y="255" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">inside its own rules</text><text x="70" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start">Install</text><text x="210" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">Steam Workshop or the Paradox launcher</text><text x="70" y="337" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start">Can change</text><text x="210" y="337" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">content: what is in the game</text><text x="70" y="378" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start">Cannot change</text><text x="210" y="378" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">how the engine works: loading speed,</text><text x="210" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">memory, crashes, engine bugs, threads</text><rect x="620" y="92" width="540" height="400" rx="12" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="890" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" font-weight="bold" fill="#e2c07a" text-anchor="middle">V3X</text><line x1="650" y1="142" x2="1130" y2="142" stroke="#b98b3e" stroke-width="1.5"/><text x="650" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2c07a" text-anchor="start">What it is</text><text x="790" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">a small native add-on: version.dll</text><text x="790" y="193" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">next to the game exe + a v3x folder</text><text x="650" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2c07a" text-anchor="start">Where it runs</text><text x="790" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">inside the game's program itself,</text><text x="790" y="255" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">so it can fix the engine</text><text x="650" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2c07a" text-anchor="start">Install</text><text x="790" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">copy into the game's binaries folder</text><text x="650" y="337" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2c07a" text-anchor="start">Can change</text><text x="790" y="337" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">the engine: e.g. 3D-model loading 37.5 s → 6.7 s,</text><text x="790" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">debug-mode autosaves 156 MB → 26 MB</text><text x="650" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#e2c07a" text-anchor="start">Rules</text><text x="790" y="399" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">single player; every plugin can be turned</text><text x="790" y="420" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#f4ecd8" text-anchor="start">off; uninstall = delete version.dll + v3x/</text><circle cx="600" cy="292" r="22" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="600" y="301" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" font-weight="bold" fill="#14202e" text-anchor="middle">+</text>
</svg>
