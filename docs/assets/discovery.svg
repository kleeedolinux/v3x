<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
<title id="t">How an optimization is found</title><desc id="d">Measure, find, fix, verify, result. Example: 3.44 million failed file lookups cost 103.8 s of thread time in one session; a per-folder file index predicts 94.4 percent of them in game with 0 mismatches.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="392" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="392" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="372" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">How an optimization is found</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">Every fix in the showcase went this way. The tools ship with V3X.</text><rect x="40" y="96" width="200" height="140" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="70" cy="126" r="16" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="70" y="132" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">1</text><text x="96" y="133" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">Measure</text><text x="58" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">devtools profiler,</text><text x="58" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">crash_logger, plugins</text><text x="58" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">in measure mode</text><line x1="242" y1="166" x2="267" y2="166" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="270" y="96" width="200" height="140" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="300" cy="126" r="16" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="300" y="132" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">2</text><text x="326" y="133" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">Find</text><text x="288" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">trace the hot spot:</text><text x="288" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">strings, xrefs, RTTI;</text><text x="288" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">notes in docs/re/</text><line x1="472" y1="166" x2="497" y2="166" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="500" y="96" width="200" height="140" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="530" cy="126" r="16" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="530" y="132" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">3</text><text x="556" y="133" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">Fix</text><text x="518" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">a plugin with</text><text x="518" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">fail-closed anchors</text><text x="518" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">and hook_safe</text><line x1="702" y1="166" x2="727" y2="166" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="730" y="96" width="200" height="140" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="760" cy="126" r="16" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="760" y="132" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">4</text><text x="786" y="133" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">Verify</text><text x="748" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">offline test against</text><text x="748" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">the real exe; measure</text><text x="748" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">mode checks answers</text><line x1="932" y1="166" x2="957" y2="166" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="960" y="96" width="200" height="140" rx="10" fill="#2f6f73" stroke="#2f6f73" stroke-width="2"/><circle cx="990" cy="126" r="16" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="990" y="132" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="middle">5</text><text x="1016" y="133" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#f4ecd8" text-anchor="start">Result</text><text x="978" y="172" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">play with it on,</text><text x="978" y="192" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">compare the logs,</text><text x="978" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#f4ecd8" text-anchor="start">keep it or drop it</text><rect x="40" y="262" width="1120" height="112" rx="8" fill="#fbf4e4" stroke="#7a5a22" stroke-width="1.2"/><text x="60" y="290" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="start">Example: failed file lookups (mod_loader, one session with 23 mods)</text><text x="58" y="322" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">3.44 M failed file lookups,</text><text x="58" y="341" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">103.8 s of thread time</text><text x="288" y="322" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">each file is searched for in</text><text x="288" y="341" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">every mod and DLC folder first</text><text x="518" y="322" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">per-folder file index,</text><text x="518" y="341" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">built once in the background</text><text x="748" y="322" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">0 mismatches against the</text><text x="748" y="341" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">engine in game</text><text x="978" y="322" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">the index predicts 94.4 %</text><text x="978" y="341" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">of the misses (in game)</text>
</svg>
