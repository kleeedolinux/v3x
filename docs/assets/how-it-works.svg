<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">How V3X works</title><desc id="d">You start Victoria 3, V3X loads with it as one extra file (version.dll), plugins fix and speed up the engine, you play. No game file is changed; delete version.dll to go back to vanilla.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="322" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="322" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="302" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">How V3X works, in one picture</text><rect x="40" y="92" width="250" height="150" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="76" cy="128" r="20" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="76" y="135" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#14202e" text-anchor="middle">1</text><text x="106" y="134" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#1f3550" text-anchor="start">You start Victoria 3</text><text x="62" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">as usual, from Steam</text><text x="62" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">or the Paradox launcher</text><line x1="294" y1="167" x2="326" y2="167" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="330" y="92" width="250" height="150" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="366" cy="128" r="20" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="366" y="135" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#14202e" text-anchor="middle">2</text><text x="396" y="134" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#1f3550" text-anchor="start">V3X loads with it</text><text x="352" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">one extra file next to</text><text x="352" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">the game: version.dll</text><line x1="584" y1="167" x2="616" y2="167" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="620" y="92" width="250" height="150" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="656" cy="128" r="20" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="656" y="135" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#14202e" text-anchor="middle">3</text><text x="686" y="134" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#1f3550" text-anchor="start">Plugins fix the engine</text><text x="642" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">faster loading, fewer crashes,</text><text x="642" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">engine bugs fixed</text><line x1="874" y1="167" x2="906" y2="167" stroke="#1f3550" stroke-width="2.5" marker-end="url(#arr)"/><rect x="910" y="92" width="250" height="150" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><circle cx="946" cy="128" r="20" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text x="946" y="135" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#14202e" text-anchor="middle">4</text><text x="976" y="134" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#1f3550" text-anchor="start">You play</text><text x="932" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">single player, every</text><text x="932" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#14202e" text-anchor="start">plugin can be turned off</text><rect x="40" y="262" width="1120" height="44" rx="8" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="600" y="290" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e2c07a" text-anchor="middle">No game file is changed.  Delete binaries/version.dll and the game is exactly vanilla again.</text>
</svg>
