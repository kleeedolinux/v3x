<title id="t">Illustration of the V3X console window (not a screenshot)</title><desc id="d">Illustration of the V3X console window (not a screenshot)</desc>
<rect x="4" y="4" width="952" height="422" rx="10" fill="#0c0c0c" stroke="#555" stroke-width="2"/><rect x="4" y="4" width="952" height="34" rx="10" fill="#e8e8e8"/><rect x="4" y="26" width="952" height="12" fill="#e8e8e8"/><text x="20" y="27" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#222" text-anchor="start">V3X console - Victoria 3 native loader</text><text x="22" y="70" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#3ad7e0" text-anchor="start">[14:02:11.031][v3x] V3X api v4, exe=...\victoria3.exe base=00007FF6... game=release/1.15.1</text><text x="22" y="96" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#3ad7e0" text-anchor="start">[14:02:11.032][v3x] entry hook at 00007FF6...: ok</text><text x="22" y="122" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#3ad7e0" text-anchor="start">[14:02:11.090][v3x] entry point reached on main thread 4242</text><text x="22" y="148" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#3ad7e0" text-anchor="start">[14:02:11.091][v3x] frame hook (PeekMessageW): ok</text><text x="22" y="174" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#4ee06a" text-anchor="start">[14:02:11.104][mem_tuner] options: table at exe+0x..., 5 option(s) set</text><text x="22" y="200" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#4ee06a" text-anchor="start">[14:02:11.118][keep_history] patched 11 Trend::Clear calls: played countries keep their graphs after a switch</text><text x="22" y="226" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#ff5c5c" text-anchor="start">[14:02:11.120][my_plugin] anchor FAILED: nothing installed (game updated?)</text><text x="22" y="252" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#3ad7e0" text-anchor="start">[14:02:11.400][v3x] 21/23 plugins loaded, 2 disabled in v3x.ini</text><text x="22" y="278" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#d6d6d6" text-anchor="start">V3X console is interactive: type 'help' and press Enter.</text><text x="22" y="304" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="normal" fill="#d6d6d6" text-anchor="start">&gt; plugins</text><rect x="102" y="291" width="9" height="16" fill="#d6d6d6"/><rect x="690.4" y="18" width="245.6" height="26" rx="13" fill="#9b2d20"/><text x="813.2" y="36" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f4ecd8" text-anchor="middle" letter-spacing="1">ILLUSTRATION · not a screenshot</text><text x="22" y="408" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#9a9a9a" text-anchor="start">Colours as in the real window: cyan = loader, green = plugins, red = failures. Log lines follow docs/troubleshooting.md.</text>
</svg>
