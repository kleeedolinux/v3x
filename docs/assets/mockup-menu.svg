<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
<title id="t">Illustration of the V3X plugin menu on the main menu (not a screenshot)</title><desc id="d">Illustration of the V3X plugin menu on the main menu (not a screenshot)</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient></defs><rect x="4" y="4" width="952" height="512" rx="12" fill="#1b1f24" stroke="#3a3f46" stroke-width="2"/><rect x="40" y="90" width="200" height="42" rx="4" fill="#2a2f36" stroke="#555b63" stroke-width="1"/><text x="140" y="117" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="normal" fill="#c9c9c9" text-anchor="middle">Continue</text><rect x="40" y="146" width="200" height="42" rx="4" fill="#2a2f36" stroke="#555b63" stroke-width="1"/><text x="140" y="173" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="normal" fill="#c9c9c9" text-anchor="middle">New Game</text><rect x="40" y="202" width="200" height="42" rx="4" fill="#2a2f36" stroke="#555b63" stroke-width="1"/><text x="140" y="229" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="normal" fill="#c9c9c9" text-anchor="middle">Load Game</text><rect x="40" y="258" width="200" height="42" rx="4" fill="#2a2f36" stroke="#555b63" stroke-width="1"/><text x="140" y="285" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="normal" fill="#c9c9c9" text-anchor="middle">Settings</text><rect x="40" y="314" width="200" height="42" rx="4" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text x="140" y="341" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="bold" fill="#e2c07a" text-anchor="middle">V3X</text><rect x="40" y="370" width="200" height="42" rx="4" fill="#2a2f36" stroke="#555b63" stroke-width="1"/><text x="140" y="397" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" font-weight="normal" fill="#c9c9c9" text-anchor="middle">Exit</text><line x1="246" y1="335" x2="290" y2="300" stroke="#b98b3e" stroke-width="2" marker-end="url(#arr)"/><rect x="300" y="64" width="620" height="420" rx="6" fill="#262b31" stroke="#b98b3e" stroke-width="2"/><rect x="300" y="64" width="620" height="44" rx="6" fill="url(#brass)"/><text x="320" y="93" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#14202e" text-anchor="start">V3X plugins</text><text x="898" y="93" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#14202e" text-anchor="end">✕</text><text x="320" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">Ticked = loaded at the next game start. Saved to binaries/v3x/v3x.ini, section plugins.</text><rect x="320" y="160" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="169" width="20" height="20" rx="3" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><path d="M336,179 L341,184 L349,173" fill="none" stroke="#e2c07a" stroke-width="3" stroke-linecap="round"/><text x="364" y="185" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">crash_logger</text><text x="500" y="185" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">own crash log with C++ type names and stacks</text><rect x="320" y="204" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="213" width="20" height="20" rx="3" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><path d="M336,223 L341,228 L349,217" fill="none" stroke="#e2c07a" stroke-width="3" stroke-linecap="round"/><text x="364" y="229" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">mem_tuner</text><text x="500" y="229" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">lower memory commit, OOM rescue</text><rect x="320" y="248" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="257" width="20" height="20" rx="3" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><path d="M336,267 L341,272 L349,261" fill="none" stroke="#e2c07a" stroke-width="3" stroke-linecap="round"/><text x="364" y="273" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">keep_history</text><text x="500" y="273" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">country graphs survive a country switch</text><rect x="320" y="292" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="301" width="20" height="20" rx="3" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><path d="M336,311 L341,316 L349,305" fill="none" stroke="#e2c07a" stroke-width="3" stroke-linecap="round"/><text x="364" y="317" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">frame_pacer</text><text x="500" y="317" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">timer sleep instead of a busy-wait frame cap</text><rect x="320" y="336" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="345" width="20" height="20" rx="3" fill="#1b1f24" stroke="#b98b3e" stroke-width="2"/><text x="364" y="361" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">lazy_mesh</text><text x="500" y="361" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">load mesh types on first use</text><text x="888" y="361" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#e2c07a" text-anchor="end">restart required</text><rect x="320" y="380" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="389" width="20" height="20" rx="3" fill="#1b1f24" stroke="#b98b3e" stroke-width="2"/><text x="364" y="405" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">alloc_tracker</text><text x="500" y="405" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">allocation report per call site (diagnostic)</text><rect x="320" y="424" width="580" height="38" rx="4" fill="#2e343b"/><rect x="332" y="433" width="20" height="20" rx="3" fill="#1b1f24" stroke="#b98b3e" stroke-width="2"/><text x="364" y="449" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="bold" fill="#e8e8e8" text-anchor="start">asset_stream</text><text x="500" y="449" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#bdbdbd" text-anchor="start">force the engine texture streamer on</text><rect x="690.4" y="18" width="245.6" height="26" rx="13" fill="#9b2d20"/><text x="813.2" y="36" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#f4ecd8" text-anchor="middle" letter-spacing="1">ILLUSTRATION · not a screenshot</text><text x="40" y="498" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#8d8d8d" text-anchor="start">Layout follows plugins/mod_menu (V3X button + plugin window). The game's real art is not reproduced. Not yet verified in game.</text>
</svg>
