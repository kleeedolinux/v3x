<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">The V3X platform</title><desc id="d">Plugins, bundled or built by the community, use the SDK and the V3X API v4 (find code, change it, run code, events). The loader version.dll loads them into the Victoria 3 engine, which stays unchanged on disk.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="552" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="552" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="532" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">The V3X platform</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">One loader, one stable C API, an SDK, and plugins from anyone</text><text x="40" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7a5a22" text-anchor="start" letter-spacing="3">PLUGINS</text><text x="40" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="start">bundled with V3X</text><rect x="40" y="146" width="95.39999999999999" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="87.7" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">mem_tuner</text><rect x="143.39999999999998" y="146" width="95.39999999999999" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="191.1" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">lazy_mesh</text><rect x="246.79999999999995" y="146" width="121.19999999999999" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="307.4" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">keep_history</text><rect x="375.99999999999994" y="146" width="78.19999999999999" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="415.1" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">enhance</text><rect x="462.19999999999993" y="146" width="104.0" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="514.2" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">mod_loader</text><rect x="574.1999999999999" y="146" width="69.6" height="34" rx="17" fill="#e6d9b8" stroke="#1f3550" stroke-width="1.5"/><text x="609" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#1f3550" text-anchor="middle">+ more</text><text x="681.8" y="136" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#2f6f73" text-anchor="start">built by you and the community</text><rect x="681.8" y="146" width="147.0" height="34" rx="17" fill="#fffaf0" stroke="#2f6f73" stroke-width="1.5" stroke-dasharray="6 4"/><text x="755.3" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#2f6f73" text-anchor="middle">your_plugin.dll</text><rect x="836.8" y="146" width="104.0" height="34" rx="17" fill="#fffaf0" stroke="#2f6f73" stroke-width="1.5" stroke-dasharray="6 4"/><text x="888.8" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#2f6f73" text-anchor="middle">a UI tweak</text><rect x="948.8" y="146" width="95.39999999999999" height="34" rx="17" fill="#fffaf0" stroke="#2f6f73" stroke-width="1.5" stroke-dasharray="6 4"/><text x="996.5" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold" fill="#2f6f73" text-anchor="middle">a sim fix</text><line x1="600" y1="186" x2="600" y2="214" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="218" width="1120" height="70" rx="10" fill="#fbf4e4" stroke="#7a5a22" stroke-width="1.5"/><text x="64" y="246" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">SDK</text><text x="64" y="270" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">sdk/ + templates/</text><text x="240" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ v3x_anchor.h: fail-closed anchors</text><text x="550" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ v3x_hook.h: safe-hook helpers</text><text x="860" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ v3x_mem.h: fault-proof reads</text><text x="240" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ v3x_testkit.h: offline tests vs the real exe</text><text x="550" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ build_plugin.py: build, test, install</text><text x="860" y="272" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#14202e" text-anchor="start">▸ plugin_template: start here</text><line x1="600" y1="288" x2="600" y2="314" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="318" width="1120" height="92" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text x="64" y="348" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#e2c07a" text-anchor="start">V3X API v4</text><text x="64" y="372" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="normal" fill="#e2c07a" text-anchor="start">include/v3x.h</text><text x="64" y="392" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#f4ecd8" text-anchor="start">plain C, versioned, append-only</text><text x="330" y="346" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#e2c07a" text-anchor="start">find code</text><text x="420" y="346" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">find_string · find_xref · function_start · pattern_scan</text><text x="330" y="364" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#e2c07a" text-anchor="start">change it</text><text x="420" y="364" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">hook_safe · hook · unhook · patch</text><text x="330" y="382" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#e2c07a" text-anchor="start">run code</text><text x="420" y="382" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">on_frame · run_on_main · register_command · exec_command</text><text x="330" y="400" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#e2c07a" text-anchor="start">talk</text><text x="420" y="400" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">on_event · emit_event: load_transition, save_begin/end, process_exit</text><line x1="600" y1="410" x2="600" y2="436" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><rect x="40" y="440" width="440" height="82" rx="10" fill="#fffaf0" stroke="#1f3550" stroke-width="2"/><text x="64" y="470" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" font-weight="bold" fill="#1f3550" text-anchor="start">Loader</text><text x="64" y="494" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">binaries/version.dll: Windows loads it with the game;</text><text x="64" y="512" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">it loads every enabled plugin before the game starts</text><line x1="480" y1="481" x2="516" y2="481" stroke="#1f3550" stroke-width="2" marker-end="url(#arr)"/><rect x="520" y="440" width="640" height="82" rx="10" fill="#14202e" stroke="#7a5a22" stroke-width="2"/><text x="544" y="470" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#e2c07a" text-anchor="start">Victoria 3 engine (victoria3.exe, unchanged on disk)</text><text x="544" y="494" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">loading · simulation ticks · saves · GUI · memory · rendering</text><text x="544" y="512" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#f4ecd8" text-anchor="start">plugins change it in memory only, after fail-closed checks</text>
</svg>
