<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 833" width="1200" height="833" role="img" aria-labelledby="t d">
<title id="t">The V3X platform</title><desc id="d">Plugins, bundled with V3X or built by the community, are built with the SDK on top of the V3X API v6 (find code, change it, run code, events). The loader version.dll (0.6.0) loads them into the Victoria 3 engine, which stays unchanged on disk.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><marker id="ah1f3550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker></defs>
<rect x="4" y="4" width="1192" height="825" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="825" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="805" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">The V3X platform</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">One loader, one stable C API, an SDK, and plugins from anyone</tspan></text><rect x="40" y="105" width="1120" height="151.4" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="1120" height="151.4" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b1" text-anchor="start" font-size="19"><tspan x="58" y="175" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#1f3550" font-weight="bold">Plugins</tspan></text><text data-box="b1" text-anchor="start" font-size="12.5"><tspan x="58" y="197.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">33 bundled + yours</tspan></text><line x1="288.6" y1="114" x2="288.6" y2="241.4" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b1" text-anchor="start" font-size="13"><tspan x="306.6" y="134.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f3550" font-weight="bold">bundled with V3X (33 plugins)</tspan></text><rect data-id="b2" data-parent="b1" x="306.6" y="143.7" width="113.5" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b2" text-anchor="middle" font-size="12.5"><tspan x="363.4" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">crash_logger</tspan></text><rect data-id="b3" data-parent="b1" x="428.1" y="143.7" width="90.6" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b3" text-anchor="middle" font-size="12.5"><tspan x="473.4" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">mem_tuner</tspan></text><rect data-id="b4" data-parent="b1" x="526.8" y="143.7" width="90.6" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b4" text-anchor="middle" font-size="12.5"><tspan x="572.1" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">lazy_mesh</tspan></text><rect data-id="b5" data-parent="b1" x="625.4" y="143.7" width="113.5" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b5" text-anchor="middle" font-size="12.5"><tspan x="682.1" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">keep_history</tspan></text><rect data-id="b6" data-parent="b1" x="746.9" y="143.7" width="75.4" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b6" text-anchor="middle" font-size="12.5"><tspan x="784.6" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">enhance</tspan></text><rect data-id="b7" data-parent="b1" x="830.3" y="143.7" width="98.2" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b7" text-anchor="middle" font-size="12.5"><tspan x="879.4" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">mod_loader</tspan></text><rect data-id="b8" data-parent="b1" x="936.5" y="143.7" width="105.9" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b8" text-anchor="middle" font-size="12.5"><tspan x="989.4" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">frame_pacer</tspan></text><rect data-id="b9" data-parent="b1" x="1050.4" y="143.7" width="90.6" height="28" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="1.3"/><text data-box="b9" text-anchor="middle" font-size="12.5"><tspan x="1095.7" y="162.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">+ 26 more</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="306.6" y="197.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#2f6f73" font-weight="bold">built by you and the community</tspan></text><rect data-id="b10" data-parent="b1" x="306.6" y="207.4" width="136.4" height="28" rx="14" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.3" stroke-dasharray="4 3"/><text data-box="b10" text-anchor="middle" font-size="12.5"><tspan x="374.8" y="226.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#2f6f73" font-weight="bold">your_plugin.dll</tspan></text><rect data-id="b11" data-parent="b1" x="451" y="207.4" width="98.2" height="28" rx="14" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.3" stroke-dasharray="4 3"/><text data-box="b11" text-anchor="middle" font-size="12.5"><tspan x="500.1" y="226.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#2f6f73" font-weight="bold">a UI tweak</tspan></text><rect data-id="b12" data-parent="b1" x="557.3" y="207.4" width="90.6" height="28" rx="14" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.3" stroke-dasharray="4 3"/><text data-box="b12" text-anchor="middle" font-size="12.5"><tspan x="602.6" y="226.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#2f6f73" font-weight="bold">a sim fix</tspan></text><rect data-id="b13" data-parent="b1" x="655.9" y="207.4" width="182.1" height="28" rx="14" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.3" stroke-dasharray="4 3"/><text data-box="b13" text-anchor="middle" font-size="12.5"><tspan x="746.9" y="226.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#2f6f73" font-weight="bold">a new console command</tspan></text><rect x="40" y="290.4" width="1120" height="94.5" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b14" x="40" y="287.4" width="1120" height="94.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b14" text-anchor="start" font-size="19"><tspan x="58" y="331.9" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#1f3550" font-weight="bold">SDK</tspan></text><text data-box="b14" text-anchor="start" font-size="12.5"><tspan x="58" y="354.7" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22">sdk/</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22"> +</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> templates/</tspan></text><line x1="288.6" y1="299.4" x2="288.6" y2="369.9" stroke="#b98b3e" stroke-width="1" opacity=".6"/><rect x="306.6" y="311.9" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 309.6 314.9)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="322.6" y="319.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">v3x_anchor.h</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: fail-closed anchors</tspan></text><rect x="593.1" y="311.9" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 596.1 314.9)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="609.1" y="319.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">v3x_hook.h</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: safe-hook helpers</tspan></text><rect x="879.5" y="311.9" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 882.5 314.9)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="895.5" y="319.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">v3x_mem.h</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: fault-proof reads</tspan></text><rect x="306.6" y="335.5" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 309.6 338.5)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="322.6" y="343.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">v3x_testkit.h</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: offline tests against the</tspan><tspan x="322.6" y="360.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">real exe</tspan></text><rect x="593.1" y="335.5" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 596.1 338.5)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="609.1" y="343.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">build_plugin.py</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: build, test, install</tspan></text><rect x="879.5" y="335.5" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 882.5 338.5)"/><text data-box="b14" text-anchor="start" font-size="13"><tspan x="895.5" y="343.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e">plugin_template</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">: start here</tspan></text><path data-arrow="1" d="M164.3,257.4 L164.3,283.4" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="176.3" y="275.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">built with</tspan></text><rect x="40" y="418.9" width="1120" height="136.4" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b15" x="40" y="415.9" width="1120" height="136.4" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text data-box="b15" text-anchor="start" font-size="19"><tspan x="58" y="473.1" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#e2c07a" font-weight="bold">V3X API v6</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="58" y="495.9" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#e2c07a">include/v3x.h</tspan><tspan x="58" y="512.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2c07a">plain C, versioned, append-only</tspan></text><line x1="288.6" y1="427.9" x2="288.6" y2="540.3" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b15" text-anchor="start" font-size="13"><tspan x="306.6" y="448.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">find code</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="387.3" y="447.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#f4ecd8">find_string · find_xref · function_start · pattern_scan</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="306.6" y="468.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">change it</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="387.3" y="468.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#f4ecd8">hook_safe · hook · unhook · patch</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="306.6" y="489.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">run code</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="387.3" y="489.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#f4ecd8">on_frame · run_on_main · register_command · exec_command</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="306.6" y="510.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">events</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="387.3" y="509.9" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#f4ecd8">on_event · emit_event: load_transition, save_begin / save_end, process_exit</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="306.6" y="530.8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">contain</tspan></text><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="387.3" y="530.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#f4ecd8">manifest caps (v6): a plugin declares what it may do; the loader refuses the rest</tspan></text><path data-arrow="1" d="M164.3,385.9 L164.3,411.9" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="176.3" y="403.8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">call</tspan></text><rect x="40" y="589.3" width="1120" height="99.3" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b16" x="40" y="586.3" width="1120" height="99.3" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b16" text-anchor="start" font-size="19"><tspan x="58" y="625" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#1f3550" font-weight="bold">Loader</tspan></text><text data-box="b16" text-anchor="start" font-size="12.5"><tspan x="58" y="647.7" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22">binaries/version.dll</tspan><tspan x="58" y="664.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">loader 0.6.0</tspan></text><line x1="288.6" y1="598.3" x2="288.6" y2="673.6" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b16" text-anchor="start" font-size="13"><tspan x="306.6" y="632.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">Windows loads</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#14202e"> binaries/version.dll</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e"> with the game because the game asks for version.dll. It loads every enabled, trusted plugin</tspan><tspan x="306.6" y="649.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">before the game's own startup code runs.</tspan></text><path data-arrow="1" d="M164.3,556.3 L164.3,582.3" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="176.3" y="574.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">served by</tspan></text><rect x="40" y="722.6" width="1120" height="82.8" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b17" x="40" y="719.6" width="1120" height="82.8" rx="10" fill="#14202e" stroke="#7a5a22" stroke-width="2"/><text data-box="b17" text-anchor="start" font-size="19"><tspan x="58" y="758.3" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" fill="#e2c07a" font-weight="bold">Victoria 3 engine</tspan></text><text data-box="b17" text-anchor="start" font-size="12.5"><tspan x="58" y="781.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#e2c07a">victoria3.exe</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e2c07a">, unchanged on disk</tspan></text><line x1="288.6" y1="731.6" x2="288.6" y2="790.5" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b17" text-anchor="start" font-size="13.5"><tspan x="306.6" y="755.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">loading · simulation ticks · saves · GUI · memory · rendering</tspan></text><text data-box="b17" text-anchor="start" font-size="13"><tspan x="306.6" y="777.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-style="italic">plugins change it in memory only, after fail-closed checks</tspan></text><path data-arrow="1" d="M164.3,689.6 L164.3,715.6" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><text text-anchor="start" font-size="12"><tspan x="176.3" y="707.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#7a5a22" font-style="italic">loads into</tspan></text>
</svg>
