<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 476" width="1200" height="476" role="img" aria-labelledby="t d">
<title id="t">How a V3X plugin finds engine code</title><desc id="d">A string or RTTI anchor, its cross-reference in code, the enclosing function from the unwind table with a prologue check, then a safe hook. Any mismatch fails closed.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><marker id="ah1f3550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="ah9b2d20" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><marker id="ah2f6f73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6f73"/></marker></defs>
<rect x="4" y="4" width="1192" height="468" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="468" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="448" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">How a plugin finds engine code</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">Addresses move with every game patch. Strings, RTTI names and code shapes rarely do.</tspan></text><rect x="40" y="105" width="245.5" height="199.8" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="245.5" height="199.8" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b1" text-anchor="start" font-size="17"><tspan x="56" y="136.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#1f3550" font-weight="bold">1 · Anchor</tspan></text><rect data-id="b2" data-parent="b1" x="56" y="153.1" width="213.5" height="33.7" rx="6" fill="#14202e"/><text data-box="b2" text-anchor="middle" font-size="13"><tspan x="162.8" y="175.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2c07a" font-weight="bold">"Processing Tick: "</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="56" y="213" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">a string in .rdata (or an RTTI class</tspan><tspan x="56" y="230.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">name) that the engine uses</tspan></text><line x1="56" y1="258.8" x2="269.5" y2="258.8" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b1" text-anchor="start" font-size="14"><tspan x="56" y="282.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6f73" font-weight="bold">find_string()</tspan></text><rect x="331.5" y="105" width="245.5" height="199.8" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b3" x="331.5" y="102" width="245.5" height="199.8" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b3" text-anchor="start" font-size="17"><tspan x="347.5" y="136.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#1f3550" font-weight="bold">2 · Cross-reference</tspan></text><rect data-id="b4" data-parent="b3" x="347.5" y="153.1" width="213.5" height="33.7" rx="6" fill="#14202e"/><text data-box="b4" text-anchor="middle" font-size="13"><tspan x="454.2" y="175.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2c07a" font-weight="bold">lea reg, [rip+disp32]</tspan></text><text data-box="b3" text-anchor="start" font-size="13"><tspan x="347.5" y="213" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">the instruction in .text that loads</tspan><tspan x="347.5" y="230.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">that string</tspan></text><line x1="347.5" y1="258.8" x2="561" y2="258.8" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b3" text-anchor="start" font-size="14"><tspan x="347.5" y="282.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6f73" font-weight="bold">find_xref()</tspan></text><rect x="623" y="105" width="245.5" height="199.8" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b5" x="623" y="102" width="245.5" height="199.8" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><text data-box="b5" text-anchor="start" font-size="17"><tspan x="639" y="136.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#1f3550" font-weight="bold">3 · Function start</tspan></text><rect data-id="b6" data-parent="b5" x="639" y="153.1" width="213.5" height="33.7" rx="6" fill="#14202e"/><text data-box="b6" text-anchor="middle" font-size="13"><tspan x="745.8" y="175.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2c07a" font-weight="bold">48 89 5C 24 ?? ...</tspan></text><text data-box="b5" text-anchor="start" font-size="13"><tspan x="639" y="213" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">the enclosing function from the</tspan><tspan x="639" y="230.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">.pdata unwind table; prologue</tspan><tspan x="639" y="247.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">bytes checked</tspan></text><line x1="639" y1="258.8" x2="852.5" y2="258.8" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b5" text-anchor="start" font-size="14"><tspan x="639" y="282.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#2f6f73" font-weight="bold">function_start()</tspan></text><rect x="914.5" y="105" width="245.5" height="199.8" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b7" x="914.5" y="102" width="245.5" height="199.8" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text data-box="b7" text-anchor="start" font-size="17"><tspan x="930.5" y="136.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#e2c07a" font-weight="bold">4 · Safe hook</tspan></text><rect data-id="b8" data-parent="b7" x="930.5" y="153.1" width="213.5" height="33.7" rx="6" fill="#14202e" stroke="#7a5a22" stroke-width="1"/><text data-box="b8" text-anchor="middle" font-size="13"><tspan x="1037.2" y="175.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#e2c07a" font-weight="bold">pre → original → post</tspan></text><text data-box="b7" text-anchor="start" font-size="13"><tspan x="930.5" y="213" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">the thunk forwards 16 integer slots</tspan><tspan x="930.5" y="230.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">+ xmm0-3 and keeps the return</tspan><tspan x="930.5" y="247.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">value</tspan></text><line x1="930.5" y1="258.8" x2="1144" y2="258.8" stroke="#b98b3e" stroke-width="1" opacity=".6"/><text data-box="b7" text-anchor="start" font-size="14"><tspan x="930.5" y="282.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" fill="#e2c07a" font-weight="bold">hook_safe()</tspan></text><path data-arrow="1" d="M289.5,170 L327.5,170" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M581,170 L619,170" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M872.5,170 L910.5,170" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><rect data-id="b9" x="40" y="349.8" width="828.5" height="95.9" rx="10" fill="#f6e3dc" stroke="#9b2d20" stroke-width="2"/><rect data-id="b10" x="914.5" y="349.8" width="245.5" height="95.9" rx="10" fill="#e3eeec" stroke="#2f6f73" stroke-width="2"/><text data-box="b9" text-anchor="start" font-size="16"><tspan x="56" y="392.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9b2d20" font-weight="bold">Not found, not unique, or the bytes differ?</tspan></text><text data-box="b9" text-anchor="start" font-size="13.5"><tspan x="56" y="417.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">Fail closed: install nothing, log</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#14202e"> anchor ... FAILED</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e"> in v3x.log; that plugin or feature stays vanilla.</tspan></text><text data-box="b10" text-anchor="start" font-size="16"><tspan x="930.5" y="383.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#2f6f73" font-weight="bold">All checks pass?</tspan></text><text data-box="b10" text-anchor="start" font-size="13.5"><tspan x="930.5" y="408.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">Hook it. The callbacks see every</tspan><tspan x="930.5" y="426.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">argument and the return value.</tspan></text><path data-arrow="1" d="M162.8,305.8 L162.8,345.8" fill="none" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah9b2d20)"/><path data-arrow="1" d="M454.2,305.8 L454.2,345.8" fill="none" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah9b2d20)"/><path data-arrow="1" d="M745.8,305.8 L745.8,345.8" fill="none" stroke="#9b2d20" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah9b2d20)"/><path data-arrow="1" d="M1037.2,305.8 L1037.2,345.8" fill="none" stroke="#2f6f73" stroke-width="2" marker-end="url(#ah2f6f73)"/>
</svg>
