<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 502" width="1200" height="502" role="img" aria-labelledby="t d">
<title id="t">A script mod compared with a V3X plugin</title><desc id="d">A script mod is text and data the game runs inside its own rules; it changes content, not the engine. A V3X plugin is compiled code inside the game's program that can hook and fix engine functions, read live data, add commands and react to loads and saves. They work together.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient></defs>
<rect x="4" y="4" width="1192" height="494" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="494" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="474" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">Script mods and V3X plugins do different jobs</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">They work together: V3X does not replace mods, and your playset stays the same.</tspan></text><rect x="40" y="105" width="530" height="369.4" rx="12" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="530" height="369.4" rx="12" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect x="630" y="105" width="530" height="369.4" rx="12" fill="#14202e" opacity=".14"/><rect data-id="b2" x="630" y="102" width="530" height="369.4" rx="12" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><line x1="62" y1="166.6" x2="548" y2="166.6" stroke="#b98b3e" stroke-width="1.2"/><line x1="652" y1="166.6" x2="1138" y2="166.6" stroke="#b98b3e" stroke-width="1.2"/><text data-box="b1" text-anchor="middle" font-size="24"><tspan x="305" y="144.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">A script mod</tspan></text><text data-box="b2" text-anchor="middle" font-size="24"><tspan x="895" y="144.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#e2c07a" font-weight="bold">A V3X plugin</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="62" y="199.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a5a22" font-weight="bold">What it is</tspan></text><text data-box="b1" text-anchor="start" font-size="13.5"><tspan x="174" y="199.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">text and data files: events, buildings, laws, GUI, scripts,</tspan><tspan x="174" y="217.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">maps, art</tspan></text><text data-box="b2" text-anchor="start" font-size="13"><tspan x="652" y="199.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">What it is</tspan></text><text data-box="b2" text-anchor="start" font-size="13.5"><tspan x="764" y="199.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">compiled C code (a DLL), loaded by V3X's small loader</tspan><tspan x="764" y="217.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">next to the game</tspan></text><line x1="62" y1="228.8" x2="548" y2="228.8" stroke="#d9cba6" stroke-width="1"/><line x1="652" y1="228.8" x2="1138" y2="228.8" stroke="#2c4a6e" stroke-width="1"/><text data-box="b1" text-anchor="start" font-size="13"><tspan x="62" y="251.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a5a22" font-weight="bold">Where it runs</tspan></text><text data-box="b1" text-anchor="start" font-size="13.5"><tspan x="174" y="251.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">the game reads it and runs it inside its own rules</tspan></text><text data-box="b2" text-anchor="start" font-size="13"><tspan x="652" y="251.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">Where it runs</tspan></text><text data-box="b2" text-anchor="start" font-size="13.5"><tspan x="764" y="251.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">inside the game's program: it can hook and fix engine</tspan><tspan x="764" y="269.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">functions</tspan></text><line x1="62" y1="281" x2="548" y2="281" stroke="#d9cba6" stroke-width="1"/><line x1="652" y1="281" x2="1138" y2="281" stroke="#2c4a6e" stroke-width="1"/><text data-box="b1" text-anchor="start" font-size="13"><tspan x="62" y="303.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a5a22" font-weight="bold">Install</tspan></text><text data-box="b1" text-anchor="start" font-size="13.5"><tspan x="174" y="303.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">Steam Workshop or the Paradox launcher</tspan></text><text data-box="b2" text-anchor="start" font-size="13"><tspan x="652" y="303.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">Can do</tspan></text><text data-box="b2" text-anchor="start" font-size="13.5"><tspan x="764" y="303.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">read live game data, add console commands, react to</tspan><tspan x="764" y="321.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">loads and saves</tspan></text><line x1="62" y1="333.2" x2="548" y2="333.2" stroke="#d9cba6" stroke-width="1"/><line x1="652" y1="333.2" x2="1138" y2="333.2" stroke="#2c4a6e" stroke-width="1"/><text data-box="b1" text-anchor="start" font-size="13"><tspan x="62" y="355.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a5a22" font-weight="bold">Can change</tspan></text><text data-box="b1" text-anchor="start" font-size="13.5"><tspan x="174" y="355.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">content: what is in the game</tspan></text><text data-box="b2" text-anchor="start" font-size="13"><tspan x="652" y="355.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">Proof</tspan></text><text data-box="b2" text-anchor="start" font-size="13.5"><tspan x="764" y="355.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#f4ecd8"> lazy_mesh</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8"> · 3D-model loading 37.5 s → </tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8" font-weight="bold">6.7 s</tspan><tspan x="764" y="373.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#f4ecd8"> enhance</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8"> · debug-mode autosaves</tspan><tspan x="764" y="391.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">156 MB → </tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8" font-weight="bold">26 MB</tspan></text><line x1="62" y1="403.2" x2="548" y2="403.2" stroke="#d9cba6" stroke-width="1"/><line x1="652" y1="403.2" x2="1138" y2="403.2" stroke="#2c4a6e" stroke-width="1"/><text data-box="b1" text-anchor="start" font-size="13"><tspan x="62" y="425.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7a5a22" font-weight="bold">Cannot change</tspan></text><text data-box="b1" text-anchor="start" font-size="13.5"><tspan x="174" y="425.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">how the engine works: loading speed, memory, crashes,</tspan><tspan x="174" y="443.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#14202e">engine bugs, threads</tspan></text><text data-box="b2" text-anchor="start" font-size="13"><tspan x="652" y="425.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e2c07a" font-weight="bold">Rules</tspan></text><text data-box="b2" text-anchor="start" font-size="13.5"><tspan x="764" y="425.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">single player; every plugin can be turned off; uninstall =</tspan><tspan x="764" y="443.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#f4ecd8">delete version.dll + v3x/</tspan></text><rect data-id="b3" x="576" y="262.7" width="48" height="48" rx="24" fill="url(#brass)" stroke="#7a5a22" stroke-width="2"/><text data-box="b3" text-anchor="middle" font-size="28"><tspan x="600" y="297.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#14202e" font-weight="bold">+</tspan></text>
</svg>
