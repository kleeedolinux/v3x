<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 421" width="1200" height="421" role="img" aria-labelledby="t d">
<title id="t">How an optimization is found</title><desc id="d">Measure, find, fix, verify, result. Example (plugin: mod_loader): 3.44 million failed file lookups cost 103.8 s of thread time in one session; a per-folder file index predicts 94.4 percent of them in game with 0 mismatches.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><marker id="ah1f3550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker></defs>
<rect x="4" y="4" width="1192" height="413" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="413" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="393" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">How an optimization is found</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">Every fix in the showcase went this way, and every fix is a plugin built on V3X. The tools ship with V3X.</tspan></text><rect x="40" y="105" width="192" height="126" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="192" height="126" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b2" data-parent="b1" x="56" y="118" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b2" text-anchor="middle" font-size="14"><tspan x="71" y="139.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">1</tspan></text><text data-box="b1" text-anchor="start" font-size="18"><tspan x="96" y="140.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Measure</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="56" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">devtools profiler,</tspan><tspan x="56" y="191.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">crash_logger, plugins in</tspan><tspan x="56" y="208.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">measure mode</tspan></text><rect x="272" y="105" width="192" height="126" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b3" x="272" y="102" width="192" height="126" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b4" data-parent="b3" x="288" y="118" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b4" text-anchor="middle" font-size="14"><tspan x="303" y="139.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">2</tspan></text><text data-box="b3" text-anchor="start" font-size="18"><tspan x="328" y="140.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Find</tspan></text><text data-box="b3" text-anchor="start" font-size="13"><tspan x="288" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">trace the hot spot: strings,</tspan><tspan x="288" y="191.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">xrefs, RTTI; notes in</tspan><tspan x="288" y="208.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">docs/re/</tspan></text><rect x="504" y="105" width="192" height="126" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b5" x="504" y="102" width="192" height="126" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b6" data-parent="b5" x="520" y="118" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b6" text-anchor="middle" font-size="14"><tspan x="535" y="139.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">3</tspan></text><text data-box="b5" text-anchor="start" font-size="18"><tspan x="560" y="140.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Fix</tspan></text><text data-box="b5" text-anchor="start" font-size="13"><tspan x="520" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">a plugin with fail-closed</tspan><tspan x="520" y="191.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">anchors and hook_safe</tspan></text><rect x="736" y="105" width="192" height="126" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b7" x="736" y="102" width="192" height="126" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b8" data-parent="b7" x="752" y="118" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b8" text-anchor="middle" font-size="14"><tspan x="767" y="139.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">4</tspan></text><text data-box="b7" text-anchor="start" font-size="18"><tspan x="792" y="140.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Verify</tspan></text><text data-box="b7" text-anchor="start" font-size="13"><tspan x="752" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">offline test against the real</tspan><tspan x="752" y="191.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">exe; measure mode</tspan><tspan x="752" y="208.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">checks the answers</tspan></text><rect x="968" y="105" width="192" height="126" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b9" x="968" y="102" width="192" height="126" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><rect data-id="b10" data-parent="b9" x="984" y="118" width="30" height="30" rx="15" fill="#e2c07a" stroke="#b98b3e" stroke-width="2"/><text data-box="b10" text-anchor="middle" font-size="14"><tspan x="999" y="139.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#14202e" font-weight="bold">5</tspan></text><text data-box="b9" text-anchor="start" font-size="18"><tspan x="1024" y="140.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#e2c07a" font-weight="bold">Result</tspan></text><text data-box="b9" text-anchor="start" font-size="13"><tspan x="984" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">play with it on, compare</tspan><tspan x="984" y="191.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f4ecd8">the logs, keep it or drop it</tspan></text><path data-arrow="1" d="M236,133 L268,133" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M468,133 L500,133" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M700,133 L732,133" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M932,133 L964,133" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><rect data-id="b11" x="40" y="256" width="1120" height="134.4" rx="12" fill="#fbf6ea" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b11" text-anchor="start" font-size="15"><tspan x="56" y="286.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Example: failed file lookups (plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.4" fill="#1f3550" font-weight="bold"> mod_loader</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">, one session with 23 mods)</tspan></text><rect data-id="b12" data-parent="b11" x="48" y="302.4" width="184" height="74" rx="8" fill="#f4ecd8" stroke="#d9cba6" stroke-width="1"/><text data-box="b12" text-anchor="start" font-size="12.5"><tspan x="60" y="328" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">3.44 M</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e"> failed file lookups,</tspan><tspan x="60" y="344.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">103.8 s</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e"> of thread time</tspan></text><rect data-id="b13" data-parent="b11" x="272" y="302.4" width="192" height="74" rx="8" fill="#f4ecd8" stroke="#d9cba6" stroke-width="1"/><text data-box="b13" text-anchor="start" font-size="12.5"><tspan x="284" y="328" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">each file is searched for in</tspan><tspan x="284" y="344.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">every mod and DLC folder</tspan><tspan x="284" y="361" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">first</tspan></text><rect data-id="b14" data-parent="b11" x="504" y="302.4" width="192" height="74" rx="8" fill="#f4ecd8" stroke="#d9cba6" stroke-width="1"/><text data-box="b14" text-anchor="start" font-size="12.5"><tspan x="516" y="328" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">a per-folder file index, built</tspan><tspan x="516" y="344.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">once in the background</tspan></text><rect data-id="b15" data-parent="b11" x="736" y="302.4" width="192" height="74" rx="8" fill="#f4ecd8" stroke="#d9cba6" stroke-width="1"/><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="748" y="328" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">0 mismatches</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e"> against the</tspan><tspan x="748" y="344.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">engine in game</tspan></text><rect data-id="b16" data-parent="b11" x="968" y="302.4" width="184" height="74" rx="8" fill="#e3eeec" stroke="#2f6f73" stroke-width="1"/><text data-box="b16" text-anchor="start" font-size="12.5"><tspan x="980" y="328" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">the index predicts</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold"> 94.4 %</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e"> of</tspan><tspan x="980" y="344.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">the misses in game</tspan></text>
</svg>
