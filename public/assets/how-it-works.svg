<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 295" width="1200" height="295" role="img" aria-labelledby="t d">
<title id="t">How V3X works</title><desc id="d">You start Victoria 3, V3X loads with it as one extra file (version.dll), plugins fix and speed up the engine, you play. No game file is changed; delete version.dll to go back to vanilla.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern><marker id="ah1f3550" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker></defs>
<rect x="4" y="4" width="1192" height="287" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="287" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="267" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">How V3X works, in one picture</tspan></text><rect x="40" y="85.6" width="250" height="111.5" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="82.6" width="250" height="111.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b2" data-parent="b1" x="56" y="98.6" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b2" text-anchor="middle" font-size="14"><tspan x="71" y="119.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">1</tspan></text><text data-box="b1" text-anchor="start" font-size="16"><tspan x="96" y="120.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3550" font-weight="bold">You start Victoria 3</tspan></text><text data-box="b1" text-anchor="start" font-size="14"><tspan x="56" y="155.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">as usual, from Steam or the</tspan><tspan x="56" y="174.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">Paradox launcher</tspan></text><rect x="330" y="85.6" width="250" height="111.5" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b3" x="330" y="82.6" width="250" height="111.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b4" data-parent="b3" x="346" y="98.6" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b4" text-anchor="middle" font-size="14"><tspan x="361" y="119.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">2</tspan></text><text data-box="b3" text-anchor="start" font-size="16"><tspan x="386" y="120.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3550" font-weight="bold">V3X loads with it</tspan></text><text data-box="b3" text-anchor="start" font-size="14"><tspan x="346" y="155.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">one extra file next to the game:</tspan><tspan x="346" y="174.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">version.dll</tspan></text><rect x="620" y="85.6" width="250" height="111.5" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b5" x="620" y="82.6" width="250" height="111.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b6" data-parent="b5" x="636" y="98.6" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b6" text-anchor="middle" font-size="14"><tspan x="651" y="119.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">3</tspan></text><text data-box="b5" text-anchor="start" font-size="16"><tspan x="676" y="120.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3550" font-weight="bold">Plugins fix the engine</tspan></text><text data-box="b5" text-anchor="start" font-size="14"><tspan x="636" y="155.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">faster loading, fewer crashes,</tspan><tspan x="636" y="174.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">engine bugs fixed</tspan></text><rect x="910" y="85.6" width="250" height="111.5" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b7" x="910" y="82.6" width="250" height="111.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="2"/><rect data-id="b8" data-parent="b7" x="926" y="98.6" width="30" height="30" rx="15" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b8" text-anchor="middle" font-size="14"><tspan x="941" y="119.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="14" fill="#f4ecd8" font-weight="bold">4</tspan></text><text data-box="b7" text-anchor="start" font-size="16"><tspan x="966" y="120.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#1f3550" font-weight="bold">You play</tspan></text><text data-box="b7" text-anchor="start" font-size="14"><tspan x="926" y="155.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">single player; every plugin can</tspan><tspan x="926" y="174.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#14202e">be turned off</tspan></text><path data-arrow="1" d="M294,113.6 L326,113.6" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M584,113.6 L616,113.6" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><path data-arrow="1" d="M874,113.6 L906,113.6" fill="none" stroke="#1f3550" stroke-width="2" marker-end="url(#ah1f3550)"/><rect data-id="b9" x="40" y="216.2" width="1120" height="48.4" rx="10" fill="#1f3550" stroke="#7a5a22" stroke-width="2"/><text data-box="b9" text-anchor="middle" font-size="15"><tspan x="600" y="246.5" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e2c07a" font-weight="bold">No game file is changed. Delete</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14.4" fill="#e2c07a" font-weight="bold"> binaries/version.dll</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e2c07a" font-weight="bold"> and the game is exactly vanilla again.</tspan></text>
</svg>
