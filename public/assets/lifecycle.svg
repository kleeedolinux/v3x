<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 498" width="1200" height="498" role="img" aria-labelledby="t d">
<title id="t">V3X plugin lifecycle</title><desc id="d">Process start, plugins load before the CRT, anchors resolve or fail closed, hooks are installed, the game runs with on_frame and hook callbacks, events between plugins, and process_exit.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs>
<rect x="4" y="4" width="1192" height="490" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="490" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="470" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">A plugin's life</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">From process start to exit, and what runs where</tspan></text><line x1="114.9" y1="122" x2="1085.1" y2="122" stroke="#b98b3e" stroke-width="3" stroke-linecap="round"/><rect data-id="b1" x="96.9" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b1" text-anchor="middle" font-size="17"><tspan x="114.9" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">1</tspan></text><rect x="40" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b2" x="40" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="114.9" y1="142" x2="114.9" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b2" text-anchor="middle" font-size="15"><tspan x="114.9" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Process start</tspan></text><text data-box="b2" text-anchor="middle" font-size="12.5"><tspan x="114.9" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">Windows maps</tspan><tspan x="114.9" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">binaries/version.dll.</tspan><tspan x="114.9" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">DllMain only hooks</tspan><tspan x="114.9" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">the exe entry point.</tspan></text><rect data-id="b3" x="258.6" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b3" text-anchor="middle" font-size="17"><tspan x="276.6" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">2</tspan></text><rect x="201.7" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b4" x="201.7" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="276.6" y1="142" x2="276.6" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b4" text-anchor="middle" font-size="15"><tspan x="276.6" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Plugins load</tspan></text><text data-box="b4" text-anchor="middle" font-size="12.5"><tspan x="276.6" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">At the entry point,</tspan><tspan x="276.6" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">before the CRT:</tspan><tspan x="276.6" y="244" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#14202e">v3x_plugin_load(&amp;api)</tspan><tspan x="276.6" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">on the main thread.</tspan></text><rect data-id="b5" x="420.3" y="104" width="36" height="36" rx="18" fill="#9b2d20" stroke="#b98b3e" stroke-width="2"/><text data-box="b5" text-anchor="middle" font-size="17"><tspan x="438.3" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">3</tspan></text><rect x="363.4" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b6" x="363.4" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#9b2d20" stroke-width="1.6"/><line x1="438.3" y1="142" x2="438.3" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b6" text-anchor="middle" font-size="15"><tspan x="438.3" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9b2d20" font-weight="bold">Anchors resolve</tspan></text><text data-box="b6" text-anchor="middle" font-size="12.5"><tspan x="438.3" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">Strings, RTTI and</tspan><tspan x="438.3" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">byte checks find</tspan><tspan x="438.3" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">code. No unique</tspan><tspan x="438.3" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">match = install</tspan><tspan x="438.3" y="278" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">nothing.</tspan></text><rect data-id="b7" x="582" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b7" text-anchor="middle" font-size="17"><tspan x="600" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">4</tspan></text><rect x="525.1" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b8" x="525.1" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="600" y1="142" x2="600" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b8" text-anchor="middle" font-size="15"><tspan x="600" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Hooks go in</tspan></text><text data-box="b8" text-anchor="middle" font-size="12.5"><tspan x="600" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">hook_safe, hook,</tspan><tspan x="600" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">patch: engine code is</tspan><tspan x="600" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">mapped but has not</tspan><tspan x="600" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">run yet.</tspan></text><rect data-id="b9" x="743.7" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b9" text-anchor="middle" font-size="17"><tspan x="761.7" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">5</tspan></text><rect x="686.9" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b10" x="686.9" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="761.7" y1="142" x2="761.7" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b10" text-anchor="middle" font-size="15"><tspan x="761.7" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Game runs</tspan></text><text data-box="b10" text-anchor="middle" font-size="12.5"><tspan x="761.7" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">on_frame every</tspan><tspan x="761.7" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">frame; hook</tspan><tspan x="761.7" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">callbacks on engine</tspan><tspan x="761.7" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">threads; console</tspan><tspan x="761.7" y="278" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">commands.</tspan></text><rect data-id="b11" x="905.4" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b11" text-anchor="middle" font-size="17"><tspan x="923.4" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">6</tspan></text><rect x="848.6" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b12" x="848.6" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="923.4" y1="142" x2="923.4" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b12" text-anchor="middle" font-size="15"><tspan x="923.4" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">Events</tspan></text><text data-box="b12" text-anchor="middle" font-size="12.5"><tspan x="923.4" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">load_transition,</tspan><tspan x="923.4" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">save_begin /</tspan><tspan x="923.4" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">save_end between</tspan><tspan x="923.4" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">plugins, on the</tspan><tspan x="923.4" y="278" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">emitter's thread.</tspan></text><rect data-id="b13" x="1067.1" y="104" width="36" height="36" rx="18" fill="#1f3550" stroke="#b98b3e" stroke-width="2"/><text data-box="b13" text-anchor="middle" font-size="17"><tspan x="1085.1" y="129.5" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" fill="#f4ecd8" font-weight="bold">7</tspan></text><rect x="1010.3" y="159" width="149.7" height="139.4" rx="8" fill="#14202e" opacity=".14"/><rect data-id="b14" x="1010.3" y="156" width="149.7" height="139.4" rx="8" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><line x1="1085.1" y1="142" x2="1085.1" y2="156" stroke="#b98b3e" stroke-width="1.5"/><text data-box="b14" text-anchor="middle" font-size="15"><tspan x="1085.1" y="184.3" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f3550" font-weight="bold">process_exit</tspan></text><text data-box="b14" text-anchor="middle" font-size="12.5"><tspan x="1085.1" y="210" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">All threads alive:</tspan><tspan x="1085.1" y="227" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">flush reports.</tspan><tspan x="1085.1" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">Afterwards the API</tspan><tspan x="1085.1" y="261" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e">refuses all calls.</tspan></text><rect data-id="b15" x="40" y="323.4" width="1120" height="144.5" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><text data-box="b15" text-anchor="start" font-size="16"><tspan x="58" y="354.8" font-family="Georgia, 'Times New Roman', Times, serif" font-size="16" fill="#1f3550" font-weight="bold">Which thread runs your code</tspan></text><rect x="58" y="375.3" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 61 378.3)"/><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="74" y="382.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">v3x_plugin_load, on_frame, run_on_main</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="375.8" y="383" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">→ main thread</tspan></text><rect x="58" y="397" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 61 400)"/><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="74" y="404.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">hook_safe pre / post callbacks</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="375.8" y="404.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">→ whatever engine thread called the function</tspan></text><rect x="58" y="418.6" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 61 421.6)"/><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="74" y="426.1" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">console commands</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="375.8" y="426.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">→ the console input thread (not the main thread)</tspan></text><rect x="58" y="440.3" width="6" height="6" rx="1" fill="#b98b3e" transform="rotate(45 61 443.3)"/><text data-box="b15" text-anchor="start" font-size="12.5"><tspan x="74" y="447.8" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" fill="#1f3550" font-weight="bold">event subscribers</tspan></text><text data-box="b15" text-anchor="start" font-size="13"><tspan x="375.8" y="448" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#14202e">→ the emitting thread</tspan></text>
</svg>
