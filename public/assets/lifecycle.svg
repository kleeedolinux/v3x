<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">V3X plugin lifecycle</title><desc id="d">Process start, plugins load before the CRT, anchors resolve or fail closed, hooks are installed, the game runs with on_frame and hook callbacks, events between plugins, and process_exit.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="462" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="462" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="442" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">A plugin's life</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">From process start to exit; what runs where</text><line x1="60" y1="150" x2="1140" y2="150" stroke="#1f3550" stroke-width="10" stroke-linecap="round"/><line x1="60" y1="150" x2="1140" y2="150" stroke="#e2c07a" stroke-width="2" stroke-dasharray="14 10"/><circle cx="110" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="110" cy="150" r="18" fill="#1f3550"/><text x="110" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">1</text><rect x="34.0" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="110" y1="176" x2="110" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="110" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">Process start</text><text x="110" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">Windows maps</text><text x="110" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">binaries/version.dll.</text><text x="110" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">DllMain only hooks</text><text x="110" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">the exe entry point.</text><circle cx="273.3" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="273.3" cy="150" r="18" fill="#1f3550"/><text x="273.3" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">2</text><rect x="197.33333333333337" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="273.3" y1="176" x2="273.3" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="273.3" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">Plugins load</text><text x="273.3" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">At the entry point,</text><text x="273.3" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">before the CRT:</text><text x="273.3" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">v3x_plugin_load(&amp;api)</text><text x="273.3" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">on the main thread.</text><circle cx="436.7" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="436.7" cy="150" r="18" fill="#1f3550"/><text x="436.7" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">3</text><rect x="360.6666666666667" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#9b2d20" stroke-width="1.5"/><line x1="436.7" y1="176" x2="436.7" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="436.7" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#9b2d20" text-anchor="middle">Anchors resolve</text><text x="436.7" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">Strings, RTTI and</text><text x="436.7" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">byte checks find code.</text><text x="436.7" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">No unique match =</text><text x="436.7" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">install nothing.</text><circle cx="600" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="600" cy="150" r="18" fill="#1f3550"/><text x="600" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">4</text><rect x="524.0" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="600" y1="176" x2="600" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="600" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">Hooks go in</text><text x="600" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">hook_safe, hook,</text><text x="600" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">patch: engine code</text><text x="600" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">is mapped but has</text><text x="600" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">not run yet.</text><circle cx="763.3" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="763.3" cy="150" r="18" fill="#1f3550"/><text x="763.3" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">5</text><rect x="687.3333333333334" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="763.3" y1="176" x2="763.3" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="763.3" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">Game runs</text><text x="763.3" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">on_frame every frame;</text><text x="763.3" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">hook callbacks on</text><text x="763.3" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">engine threads;</text><text x="763.3" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">console commands.</text><circle cx="926.7" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="926.7" cy="150" r="18" fill="#1f3550"/><text x="926.7" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">6</text><rect x="850.6666666666667" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="926.7" y1="176" x2="926.7" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="926.7" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">Events</text><text x="926.7" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">load_transition,</text><text x="926.7" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">save_begin / save_end</text><text x="926.7" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">between plugins,</text><text x="926.7" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">on the emitter's thread.</text><circle cx="1090" cy="150" r="26" fill="url(#brass)" stroke="#7a5a22" stroke-width="3"/><circle cx="1090" cy="150" r="18" fill="#1f3550"/><text x="1090" y="157" font-family="Georgia, 'Times New Roman', Times, serif" font-size="19" font-weight="bold" fill="#f4ecd8" text-anchor="middle">7</text><rect x="1014.0" y="196" width="152" height="136" rx="6" fill="#fffaf0" stroke="#1f3550" stroke-width="1.5"/><line x1="1090" y1="176" x2="1090" y2="196" stroke="#1f3550" stroke-width="1.5"/><text x="1090" y="220" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="middle">process_exit</text><text x="1090" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">All threads alive:</text><text x="1090" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">flush reports.</text><text x="1090" y="284" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">Afterwards the API</text><text x="1090" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#14202e" text-anchor="middle">refuses all calls.</text><rect x="40" y="354" width="1120" height="92" rx="8" fill="#fbf4e4" stroke="#7a5a22" stroke-width="1.2"/><text x="60" y="380" font-family="Georgia, 'Times New Roman', Times, serif" font-size="15" font-weight="bold" fill="#1f3550" text-anchor="start">Which thread runs your code</text><text x="60" y="406" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#1f3550" text-anchor="start">v3x_plugin_load, on_frame, run_on_main</text><text x="334" y="406" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">→ main thread</text><text x="620" y="406" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#1f3550" text-anchor="start">hook_safe pre / post callbacks</text><text x="838" y="406" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">→ whatever engine thread called the function</text><text x="60" y="430" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#1f3550" text-anchor="start">console commands</text><text x="180" y="430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">→ the console input thread (not the main thread)</text><text x="620" y="430" font-family="Consolas, 'Courier New', monospace" font-size="12.5" font-weight="bold" fill="#1f3550" text-anchor="start">event subscribers</text><text x="747" y="430" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#14202e" text-anchor="start">→ the emitting thread</text>
</svg>
