<title id="t">Illustration of the V3X console window (not a screenshot)</title><desc id="d">Illustration of the V3X console window (not a screenshot): loader lines in cyan, plugin lines in green, a failed anchor in red.</desc>
<defs></defs>
<rect data-id="b1" x="4" y="4" width="952" height="371.1" rx="10" fill="#0c0c0c" stroke="#3a3a3a" stroke-width="2"/><rect data-id="b2" data-parent="b1" x="4" y="4" width="952" height="40" rx="10" fill="#e8e8e8"/><rect x="4" y="34" width="952" height="10" fill="#e8e8e8"/><text data-box="b2" text-anchor="start" font-size="14"><tspan x="20" y="29.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#222">V3X console - Victoria 3 native loader</tspan></text><rect data-id="b3" data-parent="b2" x="703.8" y="11" width="236.2" height="26" rx="13" fill="#9b2d20"/><text data-box="b3" text-anchor="middle" font-size="12.5"><tspan x="821.9" y="29.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#f4ecd8" font-weight="bold">ILLUSTRATION · not a screenshot</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="76.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3ad7e0">[14:02:11.031][v3x] V3X 0.6.0 api v6, exe=...\victoria3.exe base=00007FF6... game=release/1.15.1</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="101.9" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3ad7e0">[14:02:11.032][v3x] entry hook at 00007FF6...: ok</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="127.5" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3ad7e0">[14:02:11.090][v3x] entry point reached on main thread 4242</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="153.2" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3ad7e0">[14:02:11.091][v3x] frame hook (PeekMessageW): ok</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="178.9" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#4ee06a">[14:02:11.104][mem_tuner] options: table at exe+0x..., 5 option(s) set</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="204.6" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#4ee06a">[14:02:11.118][keep_history] patched 11 Trend::Clear calls: played countries keep their graphs after a switch</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="230.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#ff5c5c">[14:02:11.120][my_plugin] anchor FAILED: nothing installed (game updated?)</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="255.9" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#3ad7e0">[14:02:11.400][v3x] 31/31 plugins loaded, 2 disabled in v3x.ini</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="281.6" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#d6d6d6">V3X console is interactive: type 'help' and press Enter.</tspan></text><text data-box="b1" text-anchor="start" font-size="13"><tspan x="22" y="307.3" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" fill="#d6d6d6">&gt; plugins</tspan></text><rect x="101.4" y="295.7" width="9" height="13.7" fill="#d6d6d6"/><text data-box="b1" text-anchor="start" font-size="12"><tspan x="22" y="355.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9a9a9a">Colours as in the real window: cyan = loader, green = plugins, red = failures. Log lines follow docs/troubleshooting.md.</tspan></text>
