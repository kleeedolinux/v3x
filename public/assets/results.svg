<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 515" width="1200" height="515" role="img" aria-labelledby="t d">
<title id="t">What the bundled plugins changed</title><desc id="d">plugin lazy_mesh: mesh loading at startup 37.5 s before, 6.7 s with it. plugin enhance: autosave in debug mode 156 MB before, 26 MB with it. plugin mem_tuner: New Game crashed before; with it and a bigger pagefile the game loads and a 4-hour session was played.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs>
<rect x="4" y="4" width="1192" height="507" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="507" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="487" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text text-anchor="start" font-size="24"><tspan x="40" y="54.2" font-family="Georgia, 'Times New Roman', Times, serif" font-size="24" fill="#1f3550" font-weight="bold">What the plugins changed</tspan></text><text text-anchor="start" font-size="13.5"><tspan x="40" y="76.4" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#7a5a22">Each fix is a plugin built on V3X. Measured in game on Victoria 3 1.15.1.</tspan></text><rect x="40" y="105" width="1120" height="125" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b1" x="40" y="102" width="1120" height="125" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><text data-box="b1" text-anchor="end" font-size="12.5"><tspan x="482.2" y="139.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">before</tspan></text><rect data-id="b2" data-parent="b1" x="494.2" y="122" width="645.8" height="24" rx="4" fill="none"/><rect x="494.2" y="122" width="586" height="24" rx="4" fill="#ada392"/><text data-box="b2" text-anchor="start" font-size="15"><tspan x="1090.2" y="140.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#14202e" font-weight="bold">37.5 s</tspan></text><text data-box="b1" text-anchor="end" font-size="12.5"><tspan x="482.2" y="173.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">with the plugin</tspan></text><rect data-id="b3" data-parent="b1" x="494.2" y="156" width="645.8" height="24" rx="4" fill="none"/><rect x="494.2" y="156" width="104.7" height="24" rx="4" fill="#2f6f73"/><text data-box="b3" text-anchor="start" font-size="15"><tspan x="608.9" y="174.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#14202e" font-weight="bold">6.7 s</tspan></text><text data-box="b1" text-anchor="start" font-size="12.5"><tspan x="387.6" y="203.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22" font-style="italic">Some work moves later: 531 on-demand loads, 28.4 s in total over that 4-hour session.</tspan></text><text data-box="b1" text-anchor="start" font-size="18"><tspan x="60" y="161.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">3D-model loading (mesh pass)</tspan></text><text data-box="b1" text-anchor="start" font-size="12.5"><tspan x="60" y="183.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> lazy_mesh</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22"> · opt-in (mode=lazy)</tspan></text><rect x="40" y="246" width="1120" height="125" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b4" x="40" y="243" width="1120" height="125" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><text data-box="b4" text-anchor="end" font-size="12.5"><tspan x="482.2" y="280.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">before</tspan></text><rect data-id="b5" data-parent="b4" x="494.2" y="263" width="645.8" height="24" rx="4" fill="none"/><rect x="494.2" y="263" width="574.6" height="24" rx="4" fill="#ada392"/><text data-box="b5" text-anchor="start" font-size="15"><tspan x="1078.9" y="281.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#14202e" font-weight="bold">156 MB</tspan></text><text data-box="b4" text-anchor="end" font-size="12.5"><tspan x="482.2" y="314.1" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#14202e" font-weight="bold">with the plugin</tspan></text><rect data-id="b6" data-parent="b4" x="494.2" y="297" width="645.8" height="24" rx="4" fill="none"/><rect x="494.2" y="297" width="95.8" height="24" rx="4" fill="#2f6f73"/><text data-box="b6" text-anchor="start" font-size="15"><tspan x="600" y="315.2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#14202e" font-weight="bold">26 MB</tspan></text><text data-box="b4" text-anchor="start" font-size="12.5"><tspan x="387.6" y="344.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22" font-style="italic">Smaller files only: the ~3.2 s save pause stays (the time goes into serializing).</tspan></text><text data-box="b4" text-anchor="start" font-size="18"><tspan x="60" y="302.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Autosave size in debug_mode</tspan></text><text data-box="b4" text-anchor="start" font-size="12.5"><tspan x="60" y="324.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> enhance</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22"> · on by default</tspan></text><rect x="40" y="387" width="1120" height="101" rx="10" fill="#14202e" opacity=".14"/><rect data-id="b7" x="40" y="384" width="1120" height="101" rx="10" fill="#fbf6ea" stroke="#1f3550" stroke-width="1.6"/><rect data-id="b8" data-parent="b7" x="387.6" y="404" width="368.2" height="34" rx="17" fill="#f6e3dc" stroke="#9b2d20" stroke-width="1.6"/><text data-box="b8" text-anchor="middle" font-size="14"><tspan x="571.7" y="426.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9b2d20" font-weight="bold">before: crashed (5 crash dumps)</tspan></text><rect data-id="b9" data-parent="b7" x="771.8" y="404" width="368.2" height="34" rx="17" fill="#e3eeec" stroke="#2f6f73" stroke-width="1.6"/><text data-box="b9" text-anchor="middle" font-size="14"><tspan x="955.9" y="426.7" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2f6f73" font-weight="bold">after: loads, 4-hour session played</tspan></text><text data-box="b7" text-anchor="start" font-size="12.5"><tspan x="387.6" y="461.6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22" font-style="italic">Cause in the dumps: Windows commit memory ran out (5-20 MB left) with 0.6-3.9 GB RAM still free.</tspan></text><text data-box="b7" text-anchor="start" font-size="18"><tspan x="60" y="431.4" font-family="Georgia, 'Times New Roman', Times, serif" font-size="18" fill="#1f3550" font-weight="bold">Starting a New Game</tspan></text><text data-box="b7" text-anchor="start" font-size="12.5"><tspan x="60" y="453.9" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22">plugin:</tspan><tspan font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12" fill="#7a5a22"> mem_tuner</tspan><tspan font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#7a5a22"> + a bigger Windows pagefile</tspan></text>
</svg>
