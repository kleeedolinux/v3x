<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">Measured results on the author's PC</title><desc id="d">Mesh loading at startup 37.5 s before, 6.7 s with lazy_mesh. Autosave in debug mode 156 MB before, 26 MB with enhance. New Game crashed before; a 4-hour session was played after mem_tuner and a bigger pagefile.</desc>
<defs><linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2c07a"/><stop offset=".55" stop-color="#b98b3e"/><stop offset="1" stop-color="#7a5a22"/></linearGradient><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1f3550"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#9b2d20"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24,0 L0,0 0,24" fill="none" stroke="#1f3550" stroke-width=".5" opacity=".08"/></pattern></defs><rect x="4" y="4" width="1192" height="462" rx="14" fill="#f4ecd8" stroke="#1f3550" stroke-width="3"/><rect x="4" y="4" width="1192" height="462" rx="14" fill="url(#grid)"/><rect x="14" y="14" width="1172" height="442" rx="8" fill="none" stroke="#b98b3e" stroke-width="1.2"/><text x="36" y="50" font-family="Georgia, 'Times New Roman', Times, serif" font-size="22" font-weight="bold" fill="#1f3550" text-anchor="start">What changed on the author's PC</text><text x="36" y="72" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#7a5a22" text-anchor="start">Measured, not estimated: 16 GB RAM, integrated GPU, Victoria 3 1.15.1. Your numbers will differ.</text><text x="40" y="128" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">3D-model loading (mesh pass)</text><text x="40" y="148" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">lazy_mesh, opt-in (mode=lazy)</text><rect x="420" y="110" width="540" height="22" rx="4" fill="#a9a294"/><text x="410" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14202e" text-anchor="end">before</text><text x="970" y="126" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="start">37.5 s</text><rect x="420" y="140" width="96.5" height="22" rx="4" fill="#2f6f73"/><text x="410" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14202e" text-anchor="end">with V3X</text><text x="526.5" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="start">6.7 s</text><text x="1160" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#14202e" text-anchor="end"></text><text x="420" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">Some work moves later: 531 on-demand loads, 28.4 s in total over that 4-hour session.</text><text x="40" y="246" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">Autosave size in debug_mode</text><text x="40" y="266" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">enhance, on by default</text><rect x="420" y="228" width="540" height="22" rx="4" fill="#a9a294"/><text x="410" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14202e" text-anchor="end">before</text><text x="970" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="start">156 MB</text><rect x="420" y="258" width="90" height="22" rx="4" fill="#2f6f73"/><text x="410" y="274" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#14202e" text-anchor="end">with V3X</text><text x="520" y="274" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#14202e" text-anchor="start">26 MB</text><text x="1160" y="250" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#14202e" text-anchor="end"></text><text x="420" y="304" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">Smaller files only: the ~3.2 s save freeze stays (the time goes into serializing).</text><text x="40" y="352" font-family="Georgia, 'Times New Roman', Times, serif" font-size="17" font-weight="bold" fill="#1f3550" text-anchor="start">Starting a New Game</text><text x="40" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">mem_tuner + a bigger Windows pagefile</text><rect x="420" y="330" width="350" height="34" rx="17" fill="#f8e6df" stroke="#9b2d20" stroke-width="1.5"/><text x="595" y="352" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#9b2d20" text-anchor="middle">before: crashed (5 crash dumps)</text><rect x="790" y="330" width="370" height="34" rx="17" fill="#e7efe9" stroke="#2f6f73" stroke-width="1.5"/><text x="975" y="352" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2f6f73" text-anchor="middle">after: loads, 4-hour session played</text><text x="420" y="392" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a5a22" text-anchor="start">Cause in the dumps: Windows commit memory ran out (5-20 MB left) with 0.6-3.9 GB RAM still free.</text>
</svg>
